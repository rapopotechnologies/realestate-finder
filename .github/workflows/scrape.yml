name: Daily scrape

# Every day at 6:00 AM Eastern. GitHub cron is UTC and ignores DST, so run at both
# 10:00 and 11:00 UTC and let the first step skip whichever one isn't 6 AM in New York.
on:
  schedule:
    - cron: "0 10 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      command:
        description: "all | taxdeeds | hud | photos"
        default: all
      counties:
        description: "Optional county FIPS codes for taxdeeds, space-separated (e.g. 12069 12095)"
        default: ""

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: scraper
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      SKIP_TRACE_PROVIDER: ${{ secrets.SKIP_TRACE_PROVIDER }}
      SKIP_TRACE_API_KEY: ${{ secrets.SKIP_TRACE_API_KEY }}
    steps:
      - name: Only at 6 AM New York time
        id: gate
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(TZ=America/New_York date +%H)" != "06" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install
        if: steps.gate.outputs.run == 'true'
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      # NAL rolls (tens of MB per county) and Census files: reuse between runs
      - uses: actions/cache@v4
        if: steps.gate.outputs.run == 'true'
        with:
          path: scraper/.cache
          key: scraper-cache-${{ github.run_id }}
          restore-keys: scraper-cache-

      - name: Scrape
        if: steps.gate.outputs.run == 'true'
        run: |
          CMD="${{ github.event.inputs.command || 'all' }}"
          COUNTIES="${{ github.event.inputs.counties }}"
          if [ -n "$COUNTIES" ]; then
            python -m omf.run "$CMD" --counties $COUNTIES
          else
            python -m omf.run "$CMD"
          fi
